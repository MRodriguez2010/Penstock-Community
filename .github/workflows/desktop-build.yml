name: Build Community desktop installers

on:
  workflow_dispatch:
    inputs:
      sign:
        description: Verify publisher signatures and notarization on default-branch installers
        type: boolean
        default: false
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-build.yml'
      - 'penstock.py'
      - 'src/**'
      - 'server/**'

permissions:
  contents: read

env:
  RUST_VERSION: '1.100.0'
  NODE_VERSION: '22.23.5'
  PYTHON_VERSION: '3.13.17'
  CARGO_BUILD_JOBS: '2'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  native:
    name: ${{ matrix.label }}
    if: ${{ !inputs.sign || github.ref_name == github.event.repository.default_branch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            runner: ubuntu-22.04
            artifact: linux-x64
            bundles: deb,appimage
          - label: Windows x64
            runner: windows-2022
            artifact: windows-x64
            bundles: nsis
          - label: macOS Apple Silicon
            runner: macos-15
            artifact: macos-arm64
            bundles: dmg
          - label: macOS Intel
            runner: macos-15-intel
            artifact: macos-x64
            bundles: dmg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Linux WebKit and bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file xdg-utils libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libfuse2 patchelf
      - name: Set the pinned Rust toolchain
        run: rustup override set ${{ env.RUST_VERSION }}
      - name: Install locked build dependencies
        run: |
          python -m pip install --only-binary=:all: --requirement desktop/build/requirements.txt
          npm ci --ignore-scripts --omit=dev --no-audit --no-fund
      - name: Check model setup validation and launcher JavaScript
        run: |
          python -m unittest discover -s tests -p 'test_desktop*.py' -v
          node --check desktop/frontend/setup.js
      - name: Package the native Python, Node and model runtimes
        run: python desktop/build/stage.py
      - name: Verify the packaged loopback launcher contract
        run: python desktop/build/smoke.py
      - name: Import Windows signing identity
        if: inputs.sign && runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: ./desktop/build/windows-signing.ps1
      - name: Sign embedded macOS runtimes
        if: inputs.sign && runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
        run: bash desktop/build/prepare-macos-signing.sh
      - name: Build native installers
        if: ${{ !(inputs.sign && runner.os == 'macOS') }}
        working-directory: desktop
        run: npx --yes --package @tauri-apps/cli@2.12.6 tauri build --bundles ${{ matrix.bundles }} -- --locked
      - name: Build and notarize the macOS application
        if: inputs.sign && runner.os == 'macOS'
        working-directory: desktop
        env:
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          : "${APPLE_ID:?}" "${APPLE_PASSWORD:?}" "${APPLE_TEAM_ID:?}"
          npx --yes --package @tauri-apps/cli@2.12.6 tauri build --bundles dmg -- --locked
          cd ..
          bash desktop/build/verify-macos.sh
      - name: Verify Windows installer signature and timestamp
        if: inputs.sign && runner.os == 'Windows'
        shell: pwsh
        run: ./desktop/build/windows-signing.ps1 -Verify
      - name: Test the installed resource layout and offline starter approvals
        run: python desktop/build/install_smoke.py
      - name: Record artifact checksums
        run: python desktop/build/checksums.py
      - name: Sign and verify Linux checksums
        if: inputs.sign && runner.os == 'Linux'
        env:
          LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
          LINUX_SIGNING_PASSPHRASE: ${{ secrets.LINUX_SIGNING_PASSPHRASE }}
          LINUX_SIGNING_FINGERPRINT: ${{ vars.LINUX_SIGNING_FINGERPRINT }}
        run: bash desktop/build/sign-linux.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: penstock-community-desktop-${{ matrix.artifact }}-${{ inputs.sign && 'signed' || 'preview' }}
          path: |
            desktop/src-tauri/target/release/bundle/**/*.AppImage
            desktop/src-tauri/target/release/bundle/**/*.deb
            desktop/src-tauri/target/release/bundle/**/*.dmg
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/SHA256SUMS.txt*
          if-no-files-found: error
          retention-days: 14
