name: Check Penstock
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-managed.txt
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/*.mjs
      - run: python penstock.py init && python penstock.py check
  installed-studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose up -d --build
      - run: curl --fail --retry 15 --retry-all-errors http://127.0.0.1:8765/health
      - run: python -m pip install selenium==4.34.2
      - name: Test sign-in, canvas, review, publication, and run history
        run: |
          export PENSTOCK_SMOKE_KEY="$(docker compose exec -T penstock python penstock.py key)"
          python tests/browser_smoke.py
      - name: Check offline starters and the executive invitation journey
        run: |
          npm install --prefix "$RUNNER_TEMP/guided-browser" --no-audit --no-fund --ignore-scripts --no-package-lock puppeteer-core@25.3.0 axe-core@4.11.1
          export CHROME_BIN="$(command -v google-chrome)" PUPPETEER_MODULE="$RUNNER_TEMP/guided-browser/node_modules/puppeteer-core"
          export AXE_SCRIPT="$RUNNER_TEMP/guided-browser/node_modules/axe-core/axe.min.js"
          python tests/verify_guided.py
      - if: always()
        run: docker compose down -v
